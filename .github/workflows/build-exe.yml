name: Build Windows EXE

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install textual pyinstaller certifi

      - name: Write build SHA
        run: |
          "${{ github.sha }}" | Out-File -FilePath src\.version -Encoding utf8 -NoNewline

      - name: Write release tag
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          if ([string]::IsNullOrEmpty($tag)) {
            $tag = git describe --tags --abbrev=0 2>$null
            if ([string]::IsNullOrEmpty($tag)) { $tag = "dev" }
          }
          $tag | Out-File -FilePath src\.release_tag -Encoding utf8 -NoNewline

      - name: Download macrecovery.py
        run: |
          # Pinned to the same OpenCorePkg release tag as src/recovery.py's
          # MACRECOVERY_URL and the ocvalidate version in test.yml — keep
          # all three in sync when bumping.
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/acidanthera/OpenCorePkg/1.0.7/Utilities/macrecovery/macrecovery.py" -OutFile "src\macrecovery.py"

      - name: Build hidden-import argument lists
        id: hiddenimports
        shell: pwsh
        run: |
          # Single source of truth: packaging/*.txt — see packaging/README.md.
          # Used to be duplicated by hand across this file (twice) and
          # HackMate-GUI.spec (which had already drifted out of sync).
          function Build-Args($file) {
            (Get-Content $file | Where-Object { $_.Trim() -ne "" } | ForEach-Object { "--hidden-import", $_.Trim() }) -join " "
          }
          $desktop = Build-Args "packaging\hiddenimports_desktop.txt"
          $bridge  = Build-Args "packaging\hiddenimports_bridge.txt"
          "desktop=$desktop" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "bridge=$bridge"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build TUI EXE
        shell: pwsh
        run: |
          $hiddenimports = "${{ steps.hiddenimports.outputs.desktop }}"
          $addData = '--add-data "src\.version;." --add-data "src\.release_tag;." --add-data "src\macrecovery.py;." --add-data "src\amd_patches.plist;." --add-data "src\assets\acpi;assets\acpi" --add-data "src\assets\data;assets\data"'
          $cmd = "pyinstaller --onefile --name HackMate --paths src $hiddenimports $addData src/hackmate.py"
          Invoke-Expression $cmd

      - name: Build Tkinter GUI EXE
        shell: pwsh
        run: |
          $hiddenimports = "${{ steps.hiddenimports.outputs.desktop }}"
          $addData = '--add-data "src\.version;." --add-data "src\.release_tag;." --add-data "src\macrecovery.py;." --add-data "src\amd_patches.plist;." --add-data "src\assets\acpi;assets\acpi" --add-data "src\assets\data;assets\data"'
          $cmd = "pyinstaller --onefile --windowed --uac-admin --name HackMate-GUI --paths src $hiddenimports $addData src/hackmate_gui.py"
          Invoke-Expression $cmd

      - name: Upload EXEs to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/HackMate.exe
            dist/HackMate-GUI.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build Flutter GUI
        working-directory: gui-flutter
        run: |
          flutter config --enable-windows-desktop
          flutter pub get
          flutter build windows --release

      - name: Build bridge EXE
        shell: pwsh
        run: |
          $hiddenimports = "${{ steps.hiddenimports.outputs.bridge }}"
          $addData = '--add-data "src\.version;." --add-data "src\.release_tag;." --add-data "src\macrecovery.py;." --add-data "src\amd_patches.plist;." --add-data "src\assets\acpi;assets\acpi" --add-data "src\assets\data;assets\data"'
          $cmd = "pyinstaller --onefile --console --name hackmate-bridge --paths src $hiddenimports $addData src/bridge.py"
          Invoke-Expression $cmd

      - name: Bundle VC++ runtime DLLs (app-local deployment)
        shell: pwsh
        run: |
          $dest = "gui-flutter\build\windows\x64\runner\Release"
          $dlls = @("msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll")

          $redistRoot = $null
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            $vsPath = & $vswhere -latest -products * -property installationPath
            if ($vsPath) {
              $verFile = Join-Path $vsPath "VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt"
              if (Test-Path $verFile) {
                $ver = (Get-Content $verFile).Trim()
                $redistRoot = Join-Path $vsPath "VC\Redist\MSVC\$ver\x64\Microsoft.VC143.CRT"
              }
            }
          }

          foreach ($dll in $dlls) {
            $src = $null
            if ($redistRoot -and (Test-Path (Join-Path $redistRoot $dll))) {
              $src = Join-Path $redistRoot $dll
            } elseif (Test-Path "$env:SystemRoot\System32\$dll") {
              $src = "$env:SystemRoot\System32\$dll"
            }
            if (-not $src) {
              throw "Could not locate $dll to bundle for app-local deployment"
            }
            Copy-Item $src $dest
          }

      - name: Zip Flutter GUI
        shell: pwsh
        run: |
          Copy-Item dist\hackmate-bridge.exe gui-flutter\build\windows\x64\runner\Release\hackmate-bridge.exe
          Compress-Archive -Path gui-flutter\build\windows\x64\runner\Release\* -DestinationPath HackMate-Flutter-GUI-Windows.zip

      - name: Upload Flutter GUI to release
        uses: softprops/action-gh-release@v2
        with:
          files: HackMate-Flutter-GUI-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
