name: Build Windows EXE

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install textual pyinstaller certifi

      - name: Write build SHA
        run: |
          "${{ github.sha }}" | Out-File -FilePath src\.version -Encoding utf8 -NoNewline

      - name: Write release tag
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          if ([string]::IsNullOrEmpty($tag)) {
            $tag = git describe --tags --abbrev=0 2>$null
            if ([string]::IsNullOrEmpty($tag)) { $tag = "dev" }
          }
          $tag | Out-File -FilePath src\.release_tag -Encoding utf8 -NoNewline

      - name: Download macrecovery.py
        run: |
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/acidanthera/OpenCorePkg/master/Utilities/macrecovery/macrecovery.py" -OutFile "src\macrecovery.py"

      - name: Build TUI EXE
        run: |
          pyinstaller --onefile --name HackMate --paths src `
            --hidden-import hardware `
            --hidden-import kexts `
            --hidden-import config_gen `
            --hidden-import smbios `
            --hidden-import recovery `
            --hidden-import ssdt `
            --hidden-import updater `
            --hidden-import efi_check `
            --hidden-import compat `
            --hidden-import oc_log `
            --hidden-import certifi `
            --hidden-import hwdb_submit `
            --hidden-import config_editor `
            --hidden-import pci_ids `
            --hidden-import pci_disable `
            --hidden-import build_history `
            --hidden-import i18n `
            --hidden-import auto_usb_map `
            --hidden-import discord_prompt `
            --hidden-import dualboot `
            --hidden-import efi_doctor `
            --hidden-import efi_health `
            --hidden-import log_checker `
            --hidden-import partutil `
            --hidden-import project_stats `
            --hidden-import offline_installer `
            --hidden-import tkinter `
            --hidden-import tkinter.filedialog `
            --add-data "src\.version;." `
            --add-data "src\.release_tag;." `
            --add-data "src\macrecovery.py;." `
            --add-data "src\amd_patches.plist;." `
            --add-data "src\assets\acpi;assets\acpi" `
            --add-data "src\assets\data;assets\data" `
            src/hackmate.py

      - name: Build Tkinter GUI EXE
        run: |
          pyinstaller --onefile --windowed --uac-admin --name HackMate-GUI --paths src `
            --hidden-import hardware `
            --hidden-import kexts `
            --hidden-import config_gen `
            --hidden-import smbios `
            --hidden-import recovery `
            --hidden-import ssdt `
            --hidden-import updater `
            --hidden-import efi_check `
            --hidden-import compat `
            --hidden-import oc_log `
            --hidden-import certifi `
            --hidden-import hwdb_submit `
            --hidden-import config_editor `
            --hidden-import pci_ids `
            --hidden-import pci_disable `
            --hidden-import build_history `
            --hidden-import i18n `
            --hidden-import auto_usb_map `
            --hidden-import discord_prompt `
            --hidden-import dualboot `
            --hidden-import efi_doctor `
            --hidden-import efi_health `
            --hidden-import log_checker `
            --hidden-import partutil `
            --hidden-import project_stats `
            --hidden-import offline_installer `
            --hidden-import tkinter `
            --hidden-import tkinter.filedialog `
            --add-data "src\.version;." `
            --add-data "src\.release_tag;." `
            --add-data "src\macrecovery.py;." `
            --add-data "src\amd_patches.plist;." `
            --add-data "src\assets\acpi;assets\acpi" `
            --add-data "src\assets\data;assets\data" `
            src/hackmate_gui.py

      - name: Upload EXEs to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/HackMate.exe
            dist/HackMate-GUI.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build Flutter GUI
        working-directory: gui-flutter
        run: |
          flutter config --enable-windows-desktop
          flutter pub get
          flutter build windows --release

      - name: Build bridge EXE
        run: |
          pyinstaller --onefile --console --name hackmate-bridge --paths src `
            --hidden-import compat `
            --hidden-import hardware `
            --hidden-import config_editor `
            --hidden-import dualboot `
            --hidden-import efi_health `
            --hidden-import hwdb_submit `
            --hidden-import log_checker `
            --hidden-import recovery `
            --hidden-import build_history `
            --hidden-import build_runner `
            --hidden-import auto_usb_map `
            --hidden-import config_gen `
            --hidden-import efi_check `
            --hidden-import kexts `
            --hidden-import smbios `
            --hidden-import ssdt `
            --hidden-import pci_ids `
            --hidden-import pci_disable `
            --hidden-import certifi `
            --add-data "src\.version;." `
            --add-data "src\.release_tag;." `
            --add-data "src\macrecovery.py;." `
            --add-data "src\amd_patches.plist;." `
            --add-data "src\assets\acpi;assets\acpi" `
            --add-data "src\assets\data;assets\data" `
            src/bridge.py

      - name: Bundle VC++ runtime DLLs (app-local deployment)
        shell: pwsh
        run: |
          $dest = "gui-flutter\build\windows\x64\runner\Release"
          $dlls = @("msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll")

          $redistRoot = $null
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            $vsPath = & $vswhere -latest -products * -property installationPath
            if ($vsPath) {
              $verFile = Join-Path $vsPath "VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt"
              if (Test-Path $verFile) {
                $ver = (Get-Content $verFile).Trim()
                $redistRoot = Join-Path $vsPath "VC\Redist\MSVC\$ver\x64\Microsoft.VC143.CRT"
              }
            }
          }

          foreach ($dll in $dlls) {
            $src = $null
            if ($redistRoot -and (Test-Path (Join-Path $redistRoot $dll))) {
              $src = Join-Path $redistRoot $dll
            } elseif (Test-Path "$env:SystemRoot\System32\$dll") {
              $src = "$env:SystemRoot\System32\$dll"
            }
            if (-not $src) {
              throw "Could not locate $dll to bundle for app-local deployment"
            }
            Copy-Item $src $dest
          }

      - name: Zip Flutter GUI
        shell: pwsh
        run: |
          Copy-Item dist\hackmate-bridge.exe gui-flutter\build\windows\x64\runner\Release\hackmate-bridge.exe
          Compress-Archive -Path gui-flutter\build\windows\x64\runner\Release\* -DestinationPath HackMate-Flutter-GUI-Windows.zip

      - name: Upload Flutter GUI to release
        uses: softprops/action-gh-release@v2
        with:
          files: HackMate-Flutter-GUI-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
